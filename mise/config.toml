# Global mise config, kept thin. Version pins belong in a repo's own
# mise.toml. Per-host tools go in ~/.config/mise/conf.d/*.toml (unmanaged).

[tools]
# default IaC tool; minor-pinned so a state-format bump is a deliberate edit
opentofu = "1.12"

[settings]
# auto-install missing tools; mise trust still gates unknown configs
auto_install = true

# warn when a project needs a tool that isn't installed
status = { missing_tools = "always" }

# honour .terraform-version / .opentofu-version files (no-op until one exists)
idiomatic_version_file = true
idiomatic_version_file_enable_tools = ["terraform", "opentofu"]
